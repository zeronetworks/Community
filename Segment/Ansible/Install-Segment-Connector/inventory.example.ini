# Copy to inventory.ini and edit. inventory.ini is ignored by git.

[segment_connector_hosts]
connector01.example.com ansible_user=admin
# 192.0.2.10 ansible_user=admin ansible_host=192.0.2.10

# Legacy hosts (for example RHEL/CentOS 6, Ubuntu 16/18) may ship Python 2.7 as the only
# suitable interpreter. Point Ansible at it explicitly. Targets that only have Python 2.7
# need ansible-core 2.16 or earlier. See README.md, Legacy platforms.
# connector02.example.com ansible_user=admin ansible_python_interpreter=/usr/bin/python2.7
