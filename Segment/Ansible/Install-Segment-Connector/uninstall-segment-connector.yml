---
# Uninstall the Zero Networks Segment Connector (Linux).
# See README.md for usage.
- name: Uninstall the Zero Networks Segment Connector
  hosts: segment_connector_hosts
  become: true
  gather_facts: true

  pre_tasks:
    - name: Verify the target is Linux
      ansible.builtin.assert:
        that:
          - ansible_facts['system'] == 'Linux'
        fail_msg: "The Segment Connector Linux installer only runs on Linux. Detected: {{ ansible_facts['system'] | default('unknown') }}."

    - name: Verify the target has an OS family fact
      ansible.builtin.assert:
        that:
          - ansible_facts['os_family'] is defined
          - ansible_facts['os_family'] | length > 0
        fail_msg: "Could not determine the OS family of {{ inventory_hostname }}. Gathered facts are required."

    - name: Check that systemd is running
      ansible.builtin.stat:
        path: /run/systemd/system
      register: segment_connector_systemd

    - name: Verify systemd is present
      ansible.builtin.assert:
        that:
          - segment_connector_systemd.stat.exists | bool
        fail_msg: "systemd is not running on {{ inventory_hostname }}. The Segment Connector service requires systemd."

  tasks:
    - name: Uninstall the Segment Connector
      ansible.builtin.import_role:
        name: install_segment_connector
        tasks_from: uninstall
