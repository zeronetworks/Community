---
galaxy_info:
  role_name: install_segment_connector
  author: Zero Networks Community
  description: Installs, reinstalls or uninstalls the Zero Networks Segment Connector (Linux) using the installer zip from the Zero Networks portal.
  license: MIT
  min_ansible_version: "2.12"
  # Platform list mirrors the Zero Networks supported-OS list; Photon, Kali, Mint, Alma/Rocky/Oracle
  # are covered via EL/Debian families. Confirm at docs.zeronetworks.com Supported Operating Systems.
  platforms:
    - name: EL
      versions:
        - "6"
        - "7"
        - "8"
        - "9"
        - "10"
    - name: Ubuntu
      versions:
        - xenial
        - bionic
        - focal
        - jammy
        - noble
    - name: Debian
      versions:
        - stretch
        - buster
        - bullseye
        - bookworm
        - trixie
    - name: Fedora
      versions:
        - all
    # Galaxy's SLES, opensuse and Amazon version lists do not include the supported releases
    # (SLES/openSUSE 15, Amazon Linux 2), so those entries use "all". The supported releases
    # are listed in README.md (Supported platforms).
    - name: SLES
      versions:
        - all
    - name: opensuse
      versions:
        - all
    - name: Amazon
      versions:
        - all
  galaxy_tags:
    - zeronetworks
    - segmentconnector

dependencies: []
